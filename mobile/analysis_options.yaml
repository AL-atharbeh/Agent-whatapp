include: package:flutter_lints/flutter.yaml

analyzer:
  # JSON القادم من الخادم «dynamic»؛ التحويل الضمني منه هو أكثر مصادر
  # الانهيار شيوعاً (type 'Null' is not a subtype of …). نجبر كل تحويل أن
  # يكون صريحاً ويمرّ عبر قارئات core/json.dart.
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - build/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - prefer_const_constructors
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - use_super_parameters
