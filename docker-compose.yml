services:
  postgres:
    image: postgres:16-alpine
    container_name: wakeel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wakeel
      POSTGRES_PASSWORD: wakeel
      POSTGRES_DB: wakeel
    ports:
      - "5433:5432"
    volumes:
      - wakeel-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wakeel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wakeel-pgdata:
